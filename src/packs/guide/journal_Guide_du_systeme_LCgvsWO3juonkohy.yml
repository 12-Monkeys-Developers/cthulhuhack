  - _id: 8y6qQY3vl7DLJMWY
    name: L'Adversaire
    type: text
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: |-
        <div class="cthack-guide">
          <h2>L'Adversaire</h2>
          <p>
            Les créatures et les PNJ hostiles utilisent la fiche <strong>Adversaire</strong>. Les cartes du tchat les appellent « Opposant ». Le compendium <strong>Adversaires</strong>
            contient les créatures du livre de base, prêtes à l'emploi.
          </p>
          <div class="guide-row">
            <div class="guide-image guide-image-half"><img src="systems/cthack/ui/guide/fr/fiche-adversaire.webp" alt="Fiche d'Adversaire, onglet Description" /></div>
            <div class="guide-image guide-image-half"><img src="systems/cthack/ui/guide/fr/fiche-adversaire-combat.webp" alt="Fiche d'Adversaire, onglet Attaques" /></div>
          </div>

          <h3>L'en-tête</h3>
          <ul>
            <li><strong>DV</strong> : les dés de vie de l'Adversaire ;</li>
            <li><strong>PV</strong> : points de vie actuels et maximum ;</li>
            <li><strong>PA</strong> : points d'armure, déduits automatiquement des dégâts qu'il subit ;</li>
            <li><strong>Malus</strong> : le malus au toucher que subissent les personnages qui l'attaquent ou lui résistent.</li>
          </ul>
          <div class="guide-astuce">
            <p>
              Fiche déverrouillée, changer les <strong>DV</strong> recalcule tout seul les PV maximum (4 par DV, en conservant les blessures déjà subies) et le malus (−1 par DV au-delà
              du premier).
            </p>
          </div>

          <h3>Les onglets</h3>
          <ul>
            <li><strong>Description</strong> : le texte de la créature (ouvert par défaut).</li>
            <li><strong>Attaques, Capacités, Magie</strong> : trois listes, avec un bouton <strong>+</strong> pour chacune quand la fiche est déverrouillée.</li>
          </ul>
          <p>
            Seuls les attaques, les capacités d'adversaire et les sorts peuvent être déposés sur cette fiche. Un clic droit sur un élément permet de l'éditer ou de le supprimer.
          </p>

          <h3>Les attaques</h3>
          <p>
            Une attaque se définit par un dé de dégâts, des dégâts fixes et un nombre d'attaques. Quand elle a un dé de dégâts, une icône de dé permet de lancer ses dégâts (dé + dégâts
            fixes, par exemple « d8 + 2 »). Si un personnage est ciblé, la carte du tchat vous propose de lui <strong>appliquer</strong> les dégâts.
          </p>
          <p>
            Une attaque à dégâts fixes seulement n'a pas d'icône de jet : ses dégâts s'appliquent quand vous la choisissez pour une riposte (voir @UUID[Compendium.cthack.guide.JournalEntry.LCgvsWO3juonkohy.JournalEntryPage.myQHUZRgImQ9cmj5]{Jets et messages}).
          </p>

          <h3>Capacités et sorts</h3>
          <ul>
            <li>
              Les <strong>capacités d'adversaire</strong> gèrent des utilisations limitées comme celles des personnages : clic droit pour <strong>Utiliser</strong>,
              <strong>Augmenter</strong> ou <strong>Réinitialiser</strong>.
            </li>
            <li>Les <strong>sorts</strong> se lancent avec l'icône de dé (jet de sanité) ; le dé du sort baisse sur un échec.</li>
          </ul>
        </div>
