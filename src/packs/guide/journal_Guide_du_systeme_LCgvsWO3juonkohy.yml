_id: LCgvsWO3juonkohy
name: Guide du système
pages:
  - _id: 6rz53Y4KlOMRvkw3
    name: Introduction
    type: text
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: |-
        <div class="cthack-guide">
          <div class="guide-banner"><img src="systems/cthack/ui/cthulhu-hack-banner-large.webp" alt="Cthulhu Hack" /></div>

          <h2>Bienvenue</h2>
          <p>
            Ce guide présente ce que le système <strong>Cthulhu Hack</strong> pour Foundry VTT met à votre disposition en tant que Meneur de jeu : les fiches, les jets de dés, le combat
            depuis le tchat et les outils pour animer la partie. Il ne remplace pas le livre de règles : il explique comment Foundry vous aide à les appliquer.
          </p>

          <h3>Sommaire</h3>
          <ul>
            <li>@UUID[Compendium.cthack.guide.JournalEntry.LCgvsWO3juonkohy.JournalEntryPage.FOaRYBbzkJhYejtu]{Options du système} : les réglages du monde et leur effet à la table.</li>
            <li>@UUID[Compendium.cthack.guide.JournalEntry.LCgvsWO3juonkohy.JournalEntryPage.RU9sFGH6pljeJQi6]{Le Personnage} : la fiche des investigateurs, leurs ressources, leur équipement et leurs conditions.</li>
            <li>@UUID[Compendium.cthack.guide.JournalEntry.LCgvsWO3juonkohy.JournalEntryPage.8y6qQY3vl7DLJMWY]{L'Adversaire} : la fiche des créatures et des PNJ hostiles.</li>
            <li>@UUID[Compendium.cthack.guide.JournalEntry.LCgvsWO3juonkohy.JournalEntryPage.myQHUZRgImQ9cmj5]{Jets et messages} : la fenêtre de jet, les cartes du tchat et le combat.</li>
            <li>@UUID[Compendium.cthack.guide.JournalEntry.LCgvsWO3juonkohy.JournalEntryPage.7BUnactZ8KvPfGhB]{Outils du MJ} : le gestionnaire de joueurs, la recherche, la Fortune et les macros.</li>
          </ul>

          <h3>Versions</h3>
          <p>Ce guide décrit la version <strong>6.2.0</strong> du système, qui nécessite <strong>Foundry VTT V14</strong>.</p>

          <h2>L'onglet Cthulhu Hack</h2>
          <div class="guide-row">
            <div class="guide-image guide-image-narrow"><img src="systems/cthack/ui/guide/fr/barre-laterale.webp" alt="Onglet Cthulhu Hack de la barre latérale" /></div>
            <div>
              <p>
                Le système ajoute un onglet à la barre latérale, reconnaissable à l'icône Cthulhu Hack. Il affiche la version installée et des liens vers les communautés où trouver de
                l'aide : le Discord des XII Singes et le Discord de la Fonderie.
              </p>
              <p>Vous y trouvez aussi, réservés au MJ, deux boutons :</p>
              <ul>
                <li><strong>Gestionnaire de joueurs</strong> : rouvre la fenêtre « Statut des joueurs » (voir @UUID[Compendium.cthack.guide.JournalEntry.LCgvsWO3juonkohy.JournalEntryPage.7BUnactZ8KvPfGhB]{Outils du MJ}) ;</li>
                <li><strong>Recherche</strong> : cherche un texte dans les journaux, les acteurs et les objets du monde.</li>
              </ul>
            </div>
          </div>

          <h2>Les compendiums</h2>
          <div class="guide-row">
            <div class="guide-image guide-image-narrow"><img src="systems/cthack/ui/guide/fr/compendiums.webp" alt="Compendiums du système" /></div>
            <div>
              <p>
                Les compendiums sont rangés dans un dossier <strong>Cthulhu Hack</strong>, avec un sous-dossier <strong>FR</strong> et un sous-dossier <strong>EN</strong> : chaque contenu
                existe dans les deux langues.
              </p>
              <ul>
                <li><strong>Guide du système</strong> : ce guide.</li>
                <li><strong>Prétirés</strong> : un investigateur prêt à jouer par archétype.</li>
                <li><strong>Archétypes</strong> : à déposer sur une fiche pour l'initialiser.</li>
                <li><strong>Capacités spéciales</strong> et <strong>Armes spéciales</strong> : les capacités et armes standard du jeu.</li>
                <li><strong>Adversaires</strong> : les créatures du livre de base.</li>
                <li><strong>Tables aléatoires</strong> : les tables Hors jeu, Folie passagère et Choc.</li>
                <li><strong>Hors jeu</strong>, <strong>Folie passagère</strong> et <strong>Choc</strong> : les conditions, à déposer sur une fiche.</li>
                <li><strong>Macros</strong> : tirages sur les tables de conséquences.</li>
              </ul>
              <p>
                Par défaut, les joueurs ne voient pas les compendiums ; les joueurs de confiance peuvent les consulter et les assistants les modifier. Le guide, lui, est consultable par
                tous les joueurs.
              </p>
            </div>
          </div>

          <h2>Modules compatibles</h2>
          <ul>
            <li><strong>Dice So Nice</strong> : le système fournit des dés aux couleurs de Cthulhu Hack.</li>
            <li><strong>Token Action HUD Cthulhu Hack</strong> (avec Token Action HUD Core) : lance sauvegardes, ressources et dégâts depuis le token sélectionné.</li>
          </ul>

          <h2>Crédits</h2>
          <p>
            Cthulhu Hack est un jeu de rôle de Paul Baldowski édité par Just Crunch Games. Il est édité en version française par Les XII Singes sous le nom Cthulhu Hack VF, dans la
            collection Dark Monkeys.
          </p>
          <p>
            La marque Cthulhu Hack VF, le logo Cthulhu Hack VF, la marque Dark Monkeys, le logo Dark Monkeys, la marque Les XII Singes, le logo Les XII Singes sont la propriété de
            ReSpell. La marque Cthulhu Hack, le logo Cthulhu Hack, la marque Just Crunch Games, le logo Just Crunch Games sont la propriété de Just Crunch Games.
          </p>
          <p>
            Les visuels utilisés sur Foundry VTT sont réalisés par Maxime Plasse (maxsmaps.com). Ils sont fournis pour l'utilisation de Foundry VTT ; toute autre utilisation ou
            reproduction doit obtenir l'accord de ReSpell / Les XII Singes.
          </p>
          <p>
            Le système est développé par Kristov, avec la contribution de Lightbringer pour les compendiums et les tests. Merci à Limpar pour la traduction anglaise des compendiums.
          </p>
        </div>
