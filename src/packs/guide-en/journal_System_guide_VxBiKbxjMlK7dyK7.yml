_id: VxBiKbxjMlK7dyK7
name: System guide
pages:
  - _id: ThKLWsHL8wFLbX3q
    name: Introduction
    type: text
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: |-
        <div class="cthack-guide">
          <div class="guide-banner"><img src="systems/cthack/ui/cthulhu-hack-banner-large.webp" alt="Cthulhu Hack" /></div>

          <h2>Welcome</h2>
          <p>
            This guide shows what the <strong>Cthulhu Hack</strong> system for Foundry VTT offers you as the Game Master: the sheets, the dice rolls, combat from the chat and the tools
            that help you run the game. It does not replace the rulebook: it explains how Foundry helps you apply the rules.
          </p>

          <h3>Contents</h3>
          <ul>
            <li>@UUID[Compendium.cthack.guide-en.JournalEntry.VxBiKbxjMlK7dyK7.JournalEntryPage.KsksA2v9ze5O80AW]{System settings}: the world settings and what they change at the table.</li>
            <li>@UUID[Compendium.cthack.guide-en.JournalEntry.VxBiKbxjMlK7dyK7.JournalEntryPage.jUW07znuDRrGJ0cm]{The Character}: the investigators' sheet, their resources, equipment and conditions.</li>
            <li>@UUID[Compendium.cthack.guide-en.JournalEntry.VxBiKbxjMlK7dyK7.JournalEntryPage.FjUQK4jDVqbQww0H]{The Opponent}: the sheet for creatures and hostile NPCs.</li>
            <li>@UUID[Compendium.cthack.guide-en.JournalEntry.VxBiKbxjMlK7dyK7.JournalEntryPage.MkpSqd2pzzBsYpRB]{Rolls and messages}: the roll dialog, the chat cards and combat.</li>
            <li>@UUID[Compendium.cthack.guide-en.JournalEntry.VxBiKbxjMlK7dyK7.JournalEntryPage.Syeh6uaZWPJzq16a]{GM tools}: the players manager, search, Fortune and macros.</li>
          </ul>

          <h3>Versions</h3>
          <p>This guide describes version <strong>6.2.0</strong> of the system, which requires <strong>Foundry VTT V14</strong>.</p>

          <h2>The Cthulhu Hack tab</h2>
          <div class="guide-row">
            <div class="guide-image guide-image-narrow"><img src="systems/cthack/ui/guide/en/barre-laterale.webp" alt="Cthulhu Hack sidebar tab" /></div>
            <div>
              <p>
                The system adds a tab to the sidebar, with the Cthulhu Hack icon. It shows the installed version and links to the communities where you can find help: the XII Singes
                Discord and the Fonderie Discord (French-speaking).
              </p>
              <p>It also holds two buttons for the GM only:</p>
              <ul>
                <li><strong>Players Manager</strong>: reopens the "Players status" window (see @UUID[Compendium.cthack.guide-en.JournalEntry.VxBiKbxjMlK7dyK7.JournalEntryPage.Syeh6uaZWPJzq16a]{GM tools});</li>
                <li><strong>Search</strong>: looks for a text in the world's journals, actors and items.</li>
              </ul>
            </div>
          </div>

          <h2>Compendiums</h2>
          <div class="guide-row">
            <div class="guide-image guide-image-narrow"><img src="systems/cthack/ui/guide/en/compendiums.webp" alt="System compendiums" /></div>
            <div>
              <p>
                The compendiums are grouped in a <strong>Cthulhu Hack</strong> folder, with an <strong>FR</strong> subfolder and an <strong>EN</strong> subfolder: every content exists in
                both languages.
              </p>
              <ul>
                <li><strong>System guide</strong>: this guide.</li>
                <li><strong>Example characters</strong>: one ready-to-play investigator per archetype.</li>
                <li><strong>Archetypes</strong>: drop one on a sheet to set it up.</li>
                <li><strong>Special abilities</strong> and <strong>Special weapons</strong>: the game's standard abilities and weapons.</li>
                <li><strong>Opponents</strong>: the creatures of the core book.</li>
                <li><strong>Tables</strong>: the Out of Action, Temporary Insanity and Shock tables.</li>
                <li><strong>Out of action</strong>, <strong>Temporary insanity</strong> and <strong>Shock</strong>: the conditions, to drop on a sheet.</li>
                <li><strong>Macros</strong>: draws on the consequence tables.</li>
              </ul>
              <p>
                By default players cannot see the compendiums; trusted players can browse them and assistants can edit them. This guide can be read by all players.
              </p>
            </div>
          </div>

          <h2>Compatible modules</h2>
          <ul>
            <li><strong>Dice So Nice</strong>: the system provides dice in Cthulhu Hack colours.</li>
            <li><strong>Token Action HUD Cthulhu Hack</strong> (with Token Action HUD Core): rolls saves, resources and damage from the selected token.</li>
          </ul>

          <h2>Credits</h2>
          <p>
            Cthulhu Hack is a roleplaying game by Paul Baldowski, published by Just Crunch Games. The French edition, Cthulhu Hack VF, is published by Les XII Singes in the Dark Monkeys
            collection.
          </p>
          <p>
            The Cthulhu Hack VF brand and logo, the Dark Monkeys brand and logo, and the Les XII Singes brand and logo are the property of ReSpell. The Cthulhu Hack brand and logo and
            the Just Crunch Games brand and logo are the property of Just Crunch Games.
          </p>
          <p>
            The artwork used in Foundry VTT is by Maxime Plasse (maxsmaps.com). It is provided for use in Foundry VTT; any other use or reproduction requires the agreement of ReSpell /
            Les XII Singes.
          </p>
          <p>The system is developed by Kristov, with Lightbringer contributing the compendiums and testing. Thanks to Limpar for the English translation of the compendiums.</p>
        </div>
