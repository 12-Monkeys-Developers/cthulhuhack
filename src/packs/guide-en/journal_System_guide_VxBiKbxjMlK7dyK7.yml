  - _id: MkpSqd2pzzBsYpRB
    name: Rolls and messages
    type: text
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: |-
        <div class="cthack-guide">
          <h2>Rolls and messages</h2>

          <h3>Available rolls</h3>
          <ul>
            <li><strong>Save</strong>: click a save name on the sheet. Success if the d20 is lower than or equal to the threshold.</li>
            <li><strong>Resource</strong>: click Flashlights, Smokes, Sanity, Wealth or the miscellaneous resource. On a failure the die goes down one step.</li>
            <li><strong>Material</strong>: die icon of a weapon or item. On a failure the material die goes down.</li>
            <li><strong>Sanity</strong>: die icon of a spell.</li>
            <li><strong>Damage</strong>: click a character's armed or unarmed damage, or the die icon of an Opponent's attack.</li>
            <li><strong>Attack</strong>: a weapon macro, or a Strength or Dexterity save declared as an attack against a targeted Opponent.</li>
          </ul>

          <h2>The roll dialog</h2>
          <div class="guide-image"><img src="systems/cthack/ui/guide/en/fenetre-jet.webp" alt="Weapon roll dialog" /></div>
          <p>Every roll opens a dialog gathering everything that changes the result:</p>
          <ul>
            <li>
              <strong>Target</strong>: if the player targeted a token (T key or right-click on the token), its image, name and opponent malus are shown. For a damage roll the GM also
              sees its armour. If several tokens are targeted, only the first one counts and a warning says so.
            </li>
            <li>
              <strong>Attack</strong>: when an Opponent is targeted, the player declares an <strong>Armed</strong> or <strong>Unarmed</strong> attack (with the matching damage die).
              For a Strength or Dexterity save, a <strong>No attack</strong> choice is offered, and selected by default.
            </li>
            <li><strong>Save</strong> and <strong>Malus</strong>: the save value and a malus from 0 to −10, pre-filled with the targeted Opponent's malus.</li>
            <li><strong>Final threshold</strong>: the threshold to beat, updated on every change.</li>
            <li>
              <strong>Modifiers</strong>: the occupation, the skills (reissue rules), the standard abilities that apply and the personal abilities that give an advantage. Clicking a
              modifier adds one step of advantage.
            </li>
            <li><strong>Advantages and disadvantages</strong>: a five-step slider, from double disadvantage to double advantage.</li>
            <li><strong>Roll visibility</strong>: public, private to the GM, blind or self only.</li>
          </ul>
          <p>
            Conditions that impose a disadvantage (Mild Concussion, Staggered, Winded) are already taken into account when the dialog opens. With an advantage the system rolls extra dice
            and keeps the best one; with a disadvantage it keeps the worst one.
          </p>

          <h2>Chat cards</h2>
          <div class="guide-row">
            <div class="guide-image guide-image-card"><img src="systems/cthack/ui/guide/en/carte-attente-degats.webp" alt="Successful attack card" /></div>
            <div>
              <p>Each roll produces a card that sums up:</p>
              <ul>
                <li>the character (portrait and name at the top of the card) and their target when there is one ("against Ghoul");</li>
                <li>the declared attack type (Armed or Unarmed);</li>
                <li>the dice rolled: with an advantage or a disadvantage, the discarded die is greyed out;</li>
                <li>the result against the threshold, the formula and the modifiers used;</li>
                <li>the threshold breakdown, which can be unfolded (save, opponent malus, malus);</li>
                <li>the <strong>Success</strong> or <strong>Failure</strong> banner;</li>
                <li>for a lost resource, how the die changed (for example "d4 → 0").</li>
              </ul>
              <p>Clicking a token portrait in the card pans the scene to that token.</p>
            </div>
          </div>
          <div class="guide-image guide-image-card"><img src="systems/cthack/ui/guide/en/carte-ressource.webp" alt="Failed resource roll card" /></div>

          <h2>Combat from the chat</h2>
          <p>When a character attacks a targeted Opponent, the whole exchange fits on <strong>a single card</strong>, updated as the actions go.</p>

          <h3>The attack succeeds</h3>
          <ol>
            <li>
              The card reads "Hit! Waiting for …'s damage". The player (or the GM) clicks <strong>Roll armed damage</strong> or <strong>Roll unarmed damage</strong>. With the
              <strong>Simultaneous damage</strong> setting, this roll is made automatically.
            </li>
            <li>The damage is added to the card. Only you see the armour deducted and the real damage.</li>
            <li>The <strong>Apply … damage to …</strong> button, for the GM only, removes the real damage from the Opponent's HP. The card then shows how the HP changed.</li>
          </ol>
          <div class="guide-row">
            <div class="guide-image guide-image-card"><img src="systems/cthack/ui/guide/en/carte-degats.webp" alt="Damage rolled on the card" /></div>
            <div class="guide-image guide-image-card"><img src="systems/cthack/ui/guide/en/carte-reussite.webp" alt="Damage applied" /></div>
          </div>

          <h3>The attack fails: the counter-attack</h3>
          <ol>
            <li>The card says the Opponent strikes back and waits for the GM. Click <strong>Choose the attack</strong>.</li>
            <li>A dialog lists the Opponent's attacks, with their dice or fixed damage. Pick one and click <strong>Roll damage</strong>.</li>
            <li>The damage is added to the card, with the <strong>Apply … damage to …</strong> button that removes it from the character's HP.</li>
          </ol>
          <div class="guide-row">
            <div class="guide-image guide-image-card"><img src="systems/cthack/ui/guide/en/carte-attente-mj.webp" alt="Counter-attack waiting for the GM" /></div>
            <div class="guide-image guide-image-half"><img src="systems/cthack/ui/guide/en/choix-attaque.webp" alt="Choosing the Opponent's attack" /></div>
            <div class="guide-image guide-image-card"><img src="systems/cthack/ui/guide/en/carte-riposte.webp" alt="Opponent's counter-attack" /></div>
          </div>
          <div class="guide-astuce">
            <p>
              If health is tracked with <strong>Hit dice</strong> only, there are no HP to remove: a failure directly offers the character a <strong>Hit Dice roll</strong>, and the
              Apply button is replaced by that roll for a wounded character.
            </p>
          </div>

          <h3>Other damage rolls</h3>
          <ul>
            <li>A character's damage roll against a targeted Opponent deducts its armour and offers the Apply button.</li>
            <li>An Opponent's attack rolled from its sheet against a targeted character also offers the Apply button.</li>
          </ul>

          <h2>Asking for a roll from a journal: @jet</h2>
          <p>
            In a journal, or in an actor's or item's description, you can insert a roll request link. When you click it, a <strong>"Roll of … for all !"</strong> message is posted in
            the chat; each player clicks <strong>Let's roll !</strong> to roll with the character assigned to them (in the user configuration).
          </p>
          <div class="guide-image"><img src="systems/cthack/ui/guide/en/journal-jet.webp" alt="@jet links in a journal" /></div>
          <div class="guide-row">
            <div class="guide-image guide-image-card"><img src="systems/cthack/ui/guide/en/demande-jet.webp" alt="Roll request, GM view" /></div>
            <div class="guide-image guide-image-card"><img src="systems/cthack/ui/guide/en/demande-jet-joueur.webp" alt="Roll request, player view" /></div>
          </div>

          <h3>Syntax</h3>
          <p><code>@jet[target]{title}(advantage)</code></p>
          <p>
            The braces and parentheses are required, even when empty. The <strong>title</strong> is optional: it replaces the link text and is shown below the request in the chat.
            <code>@roll</code> works the same way as <code>@jet</code>.
          </p>
          <table class="guide-table">
            <thead>
              <tr><th>Target</th><th>Requested roll</th></tr>
            </thead>
            <tbody>
              <tr><td><code>str</code>, <code>dex</code>, <code>con</code>, <code>wis</code>, <code>int</code>, <code>cha</code></td><td>Save</td></tr>
              <tr><td><code>flashlights</code>, <code>smokes</code>, <code>san</code></td><td>Flashlights, Smokes, Sanity</td></tr>
              <tr><td><code>wealthDice</code>, <code>hitDice</code>, <code>miscellaneous</code></td><td>Wealth, Hit Dice, miscellaneous resource</td></tr>
            </tbody>
          </table>
          <p>
            The advantage is optional: <code>++</code> double advantage, <code>+</code> advantage, <code>-</code> disadvantage, <code>--</code> double disadvantage. It is carried over
            to the player's roll dialog.
          </p>
          <p>Examples:</p>
          <ul>
            <li><code>@jet[wis]{Resist the horror}(-)</code>: Wisdom save with disadvantage, link titled "Resist the horror";</li>
            <li><code>@jet[flashlights]{}()</code>: Flashlights roll.</li>
          </ul>
        </div>
