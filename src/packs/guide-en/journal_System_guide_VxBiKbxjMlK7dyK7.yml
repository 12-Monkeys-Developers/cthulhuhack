  - _id: FjUQK4jDVqbQww0H
    name: The Opponent
    type: text
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: |-
        <div class="cthack-guide">
          <h2>The Opponent</h2>
          <p>
            Creatures and hostile NPCs use the <strong>Opponent</strong> sheet. The <strong>Opponents</strong> compendium holds the creatures of the core book, ready to use.
          </p>
          <div class="guide-row">
            <div class="guide-image guide-image-half"><img src="systems/cthack/ui/guide/en/fiche-adversaire.webp" alt="Opponent sheet, Description tab" /></div>
            <div class="guide-image guide-image-half"><img src="systems/cthack/ui/guide/en/fiche-adversaire-combat.webp" alt="Opponent sheet, Attacks tab" /></div>
          </div>

          <h3>The header</h3>
          <ul>
            <li><strong>HD</strong>: the Opponent's hit dice;</li>
            <li><strong>HP</strong>: current and maximum hit points;</li>
            <li><strong>AP</strong>: armour points, deducted automatically from the damage it takes;</li>
            <li><strong>Penalty</strong>: the malus suffered by the characters who attack or resist it.</li>
          </ul>
          <div class="guide-astuce">
            <p>
              On an unlocked sheet, changing the <strong>HD</strong> recomputes the maximum HP (4 per HD, keeping the wounds already taken) and the penalty (−1 per HD beyond the first).
            </p>
          </div>

          <h3>The tabs</h3>
          <ul>
            <li><strong>Description</strong>: the creature's text (open by default).</li>
            <li><strong>Attacks, Abilities, Magic</strong>: three lists, each with a <strong>+</strong> button when the sheet is unlocked.</li>
          </ul>
          <p>Only attacks, opponent abilities and spells can be dropped on this sheet. Right-click an element to edit or delete it.</p>

          <h3>Attacks</h3>
          <p>
            An attack is defined by a damage die, fixed damage and a number of attacks. When it has a damage die, a die icon rolls its damage (die + fixed damage, for example
            "d8 + 2"). If a character is targeted, the chat card offers to <strong>apply</strong> the damage to them.
          </p>
          <p>An attack with fixed damage only has no roll icon: its damage applies when you pick it for a counter-attack (see @UUID[Compendium.cthack.guide-en.JournalEntry.VxBiKbxjMlK7dyK7.JournalEntryPage.MkpSqd2pzzBsYpRB]{Rolls and messages}).</p>

          <h3>Abilities and spells</h3>
          <ul>
            <li>
              <strong>Opponent abilities</strong> track limited uses like the characters' abilities: right-click to <strong>Use</strong>, <strong>Increase</strong> or
              <strong>Reset</strong>.
            </li>
            <li><strong>Spells</strong> are cast with the die icon (sanity check); the spell's die goes down on a failure.</li>
          </ul>
        </div>
